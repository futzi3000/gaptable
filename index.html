<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GapTable</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #0e0e0e;
      color: #ddd;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.lead { margin: 0 0 20px; color: #999; font-size: 14px; line-height: 1.45; }
    .controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
      margin-bottom: 16px; font-size: 13px;
    }
    .seg { display: inline-flex; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    .seg button {
      background: none; border: 0; color: #aaa; padding: 7px 12px; font: inherit; cursor: pointer;
    }
    .seg button[aria-pressed="true"] { background: #2a2a2a; color: #fff; }
    label { display: inline-flex; align-items: center; gap: 8px; }
    input[type="range"] { width: 140px; }
    output { min-width: 64px; color: #fff; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>GapTable</h1>
    <p class="lead">Die Tabelle zeigt Abstände so, wie sie wirklich sind: Je mehr Punkte zwei Teams trennen, desto größer ist der Leerraum zwischen ihnen.</p>

    <div class="controls">
      <div class="seg" role="group" aria-label="Liga">
        <button data-league="bl1" aria-pressed="true">1. Bundesliga</button>
        <button data-league="bl2" aria-pressed="false">2. Bundesliga</button>
      </div>
      <label>Lücke
        <input id="gap" type="range" min="0" max="20" step="1" value="6">
        <output id="gapOut">6 px/Pkt</output>
      </label>
    </div>

    <gap-table id="table" league="bl1" gap="6"></gap-table>
  </main>

  <script src="gap-table.js"></script>
  <script>
    const table = document.getElementById('table');
    const gap = document.getElementById('gap');
    const gapOut = document.getElementById('gapOut');

    document.querySelectorAll('[data-league]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-league]').forEach(b => b.setAttribute('aria-pressed', b === btn));
        table.setAttribute('league', btn.dataset.league);
      });
    });

    gap.addEventListener('input', () => {
      table.setAttribute('gap', gap.value);
      gapOut.textContent = gap.value === '0' ? 'aus' : `${gap.value} px/Pkt`;
    });
  </script>
</body>
</html>
